openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: copilot
    description: Corporate actions operations workbench
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the requested safe return path.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC logout endpoint.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /session:
    get:
      operationId: getSession
      tags: [copilot]
      summary: Get the signed-in operational operator
      responses:
        "200":
          description: Authenticated operational operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalActor"
        "401":
          description: No signed-in operator
    post:
      operationId: signInSession
      tags: [copilot]
      summary: Establish an allowlisted POC demo operator session
      description: Available only when the server is running in its non-production POC environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed-in operational operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalActor"
        "400":
          description: Invalid operational operator
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /issuers:
    get:
      operationId: listIssuers
      tags: [issuers]
      summary: List every issuer the house holds, ranked by exposure
      responses:
        "200":
          description: Held issuers ranked by house exposure
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IssuerSummary"
  /issuers/{issuerId}:
    get:
      operationId: getIssuer
      tags: [issuers]
      summary: Get the issuer accountability view
      parameters:
        - name: issuerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issuer accountability view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerDetail"
        "404":
          description: Issuer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [copilot]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /analysis:
    get:
      operationId: getAnalysis
      tags: [copilot]
      summary: Get aggregate portfolio and historical analysis
      responses:
        "200":
          description: Server-derived aggregate analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /schemes:
    get:
      operationId: listSchemes
      tags: [schemes]
      summary: List all fund manager scheme summaries
      responses:
        "200":
          description: All portfolio schemes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemeSummary"
  /schemes/{schemeId}:
    get:
      operationId: getScheme
      tags: [schemes]
      summary: Get a fund manager scheme accountability view
      security:
        - CorporateActionSession: []
      parameters:
        - name: schemeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Scheme accountability view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemeDetail"
        "404":
          description: Scheme not found
  /desk:
    get:
      operationId: getArkaDesk
      tags: [arka-desk]
      summary: Get the Arka Mutual Fund Bharat Renewables decision desk
      security:
        - CorporateActionSession: []
      responses:
        "200":
          description: Arka rights issue decision desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArkaDesk"
  /desk/decisions:
    post:
      operationId: saveArkaDeskDecisions
      tags: [arka-desk]
      summary: Save fund manager rights issue decisions
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArkaDeskDecisionInput"
      responses:
        "200":
          description: Updated Arka decision desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArkaDesk"
        "400":
          description: Invalid decision
        "403":
          description: Fund Manager role required
  /desk/submit:
    post:
      operationId: submitArkaDesk
      tags: [arka-desk]
      summary: Submit resolved Arka decisions for compliance checking
      security:
        - CorporateActionSession: []
      responses:
        "200":
          description: Submitted Arka decision desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArkaDesk"
        "409":
          description: Submission is blocked
  /desk/approval:
    post:
      operationId: approveArkaDesk
      tags: [arka-desk]
      summary: Approve or return an Arka decision submission
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArkaDeskApprovalInput"
      responses:
        "200":
          description: Checked Arka decision desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArkaDesk"
        "409":
          description: Maker-checker validation failed
  /events:
    get:
      operationId: listEvents
      tags: [copilot]
      summary: List corporate action events
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: eventType
          schema:
            type: string
      responses:
        "200":
          description: Corporate action events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSummary"
  /discovery/search:
    post:
      operationId: searchLiveCorporateActions
      tags: [copilot]
      summary: Search public web sources for indicative corporate-action notices
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveDiscoveryInput"
      responses:
        "200":
          description: Indicative web discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveDiscoveryResponse"
        "400":
          description: Invalid search query
        "502":
          description: Web discovery provider unavailable
  /discovery/last:
    get:
      operationId: getLastDiscovery
      tags: [copilot]
      summary: Return the most recent public web discovery search and its results
      security:
        - CorporateActionSession: []
      responses:
        "200":
          description: The last stored discovery search, when one exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastDiscoveryResponse"
  /intake:
    post:
      operationId: createIntake
      tags: [copilot]
      summary: Create a corporate-action case from a named synthetic sample
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeInput"
      responses:
        "201":
          description: Created event case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          description: Invalid or duplicate notice
  /intake/drafts:
    post:
      operationId: createIntakeDraft
      tags: [copilot]
      summary: Capture a corporate-action source before extraction
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeDraftInput"
      responses:
        "201":
          description: Captured intake source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}:
    get:
      operationId: getIntakeDraft
      tags: [copilot]
      summary: Get a captured corporate-action source
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Intake source and extraction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/extract:
    post:
      operationId: extractIntakeDraft
      tags: [copilot]
      summary: Extract proposed corporate-action terms from a captured source
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Extracted source details ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/validate:
    post:
      operationId: validateIntakeDraft
      tags: [copilot]
      summary: Validate extracted corporate-action details before case creation
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeValidationInput"
      responses:
        "200":
          description: Updated draft after analyst validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/create-case:
    post:
      operationId: createCaseFromIntakeDraft
      tags: [copilot]
      summary: Create a controlled case from analyst-validated intake data
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "201":
          description: Created corporate-action event case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected document upload URL
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlInput"
      responses:
        "200":
          description: Presigned upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResult"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [copilot]
      summary: Get a corporate action event and its workbench data
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Corporate action event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
    patch:
      operationId: updateEvent
      tags: [copilot]
      summary: Update analyst-controlled event terms
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/calculate:
    post:
      operationId: calculateEvent
      tags: [copilot]
      summary: Run deterministic eligibility and impact calculation
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateInput"
      responses:
        "200":
          description: Calculated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "409":
          description: Calculation is blocked by invalid or incomplete terms
        "404":
          description: Event not found
  /events/{eventId}/election:
    post:
      operationId: saveElection
      tags: [copilot]
      summary: Save an election for an affected account
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/approval:
    post:
      operationId: approveEvent
      tags: [copilot]
      summary: Record maker-checker approval
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/instruction:
    post:
      operationId: updateInstruction
      tags: [copilot]
      summary: Update simulated instruction status
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/reconciliation:
    post:
      operationId: saveReconciliation
      tags: [copilot]
      summary: Record expected versus actual settlement
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /tasks:
    get:
      operationId: listTasks
      tags: [copilot]
      summary: List operational tasks and flags
      responses:
        "200":
          description: Operational tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /tasks/{taskId}/resolve:
    post:
      operationId: resolveTask
      tags: [copilot]
      summary: Resolve an operational task
      security:
        - CorporateActionSession: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /events/{eventId}/judgement:
    post:
      operationId: generateJudgement
      tags: [copilot]
      summary: Run Stage 2 AI judgement over the Stage 1 deterministic output
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Updated event with the latest judgement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Event not found
  /audit/export:
    get:
      operationId: exportAudit
      tags: [copilot]
      summary: Download the full audit trail as a compliance CSV export
      responses:
        "200":
          description: Full audit trail in CSV form
          content:
            text/csv:
              schema:
                type: string
  /audit:
    get:
      operationId: listAudit
      tags: [copilot]
      summary: List audit history
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
      responses:
        "200":
          description: Audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
components:
  securitySchemes:
    CorporateActionSession:
      type: apiKey
      in: cookie
      name: corporate_actions_actor
      description: Signed HTTP-only demo identity available only in the non-production POC environment.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: "Opaque session token: `Bearer <sid>`."
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        type: string
    DraftId:
      in: path
      name: draftId
      required: true
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [arrivalCount24h, arrivalsAffectingSchemes24h, portfolioEventCount, impactedSchemeCount, totalSchemeCount, totalFunding, nearestDeadline, nearestFundingIssuer, needsYouCount, needsNothingCount, atStakeAmount, dueWithin3DaysCount, settlementBreakCount, topHouseExposures, dataTrust, lastQuarter, inboundEvents, schemes]
      properties:
        arrivalCount24h: { type: number }
        arrivalsAffectingSchemes24h: { type: number }
        portfolioEventCount: { type: number }
        impactedSchemeCount: { type: number }
        totalSchemeCount: { type: number }
        totalFunding: { type: number }
        nearestDeadline: { type: string }
        nearestFundingIssuer: { type: string }
        needsYouCount: { type: number }
        needsNothingCount: { type: number }
        atStakeAmount: { type: number }
        dueWithin3DaysCount: { type: number }
        settlementBreakCount: { type: number }
        topHouseExposures:
          type: array
          items:
            $ref: "#/components/schemas/DashboardHouseExposure"
        dataTrust:
          $ref: "#/components/schemas/DashboardDataTrust"
        lastQuarter:
          $ref: "#/components/schemas/DashboardLastQuarter"
        inboundEvents:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        schemes:
          type: array
          items:
            $ref: "#/components/schemas/SchemeSummary"
    DashboardHouseExposure:
      type: object
      required: [issuerId, issuer, houseExposureAmount, schemesHolding, tightestHeadroomPercent, attention]
      properties:
        issuerId: { type: string }
        issuer: { type: string }
        houseExposureAmount: { type: number }
        schemesHolding: { type: number }
        tightestHeadroomPercent: { type: ["number", "null"] }
        attention: { type: ["string", "null"] }
    DashboardDataTrust:
      type: object
      required: [conflictingSourceCount, lastDeliveryChannel, lastDeliveryAt, allSynthetic]
      properties:
        conflictingSourceCount: { type: number }
        lastDeliveryChannel: { type: string }
        lastDeliveryAt: { type: string }
        allSynthetic: { type: boolean }
    DashboardLastQuarter:
      type: object
      required: [capturedAmount, forfeitedAmount, lapsedCount, deadlinesMet, deadlinesTotal]
      properties:
        capturedAmount: { type: number }
        forfeitedAmount: { type: number }
        lapsedCount: { type: number }
        deadlinesMet: { type: number }
        deadlinesTotal: { type: number }
    IssuerSummary:
      type: object
      required: [issuerId, issuer, isin, houseExposureAmount, percentOfAum, schemesHolding, openActionCount, tightestHeadroomPercent, attention]
      properties:
        issuerId: { type: string }
        issuer: { type: string }
        isin: { type: string }
        houseExposureAmount: { type: number }
        percentOfAum: { type: number }
        schemesHolding: { type: number }
        openActionCount: { type: number }
        tightestHeadroomPercent: { type: ["number", "null"] }
        attention: { type: ["string", "null"] }
    IssuerDetail:
      type: object
      required: [issuerId, issuer, isin, situation, houseExposure, perScheme, events, summary]
      properties:
        issuerId: { type: string }
        issuer: { type: string }
        isin: { type: string }
        situation: { type: string }
        houseExposure:
          $ref: "#/components/schemas/IssuerHouseExposure"
        perScheme:
          type: array
          items:
            $ref: "#/components/schemas/IssuerSchemeRow"
