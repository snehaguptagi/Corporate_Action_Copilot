openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: copilot
    description: Corporate actions operations workbench
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the requested safe return path.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC logout endpoint.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /session:
    get:
      operationId: getSession
      tags: [copilot]
      summary: Get the signed-in operational operator
      responses:
        "200":
          description: Authenticated operational operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalActor"
        "401":
          description: No signed-in operator
    post:
      operationId: signInSession
      tags: [copilot]
      summary: Establish an allowlisted POC demo operator session
      description: Available only when the server is running in its non-production POC environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed-in operational operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalActor"
        "400":
          description: Invalid operational operator
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [copilot]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /events:
    get:
      operationId: listEvents
      tags: [copilot]
      summary: List corporate action events
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: risk
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: eventType
          schema:
            type: string
      responses:
        "200":
          description: Corporate action events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSummary"
  /intake:
    post:
      operationId: createIntake
      tags: [copilot]
      summary: Create a corporate-action case from a named synthetic sample
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeInput"
      responses:
        "201":
          description: Created event case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          description: Invalid or duplicate notice
  /intake/drafts:
    post:
      operationId: createIntakeDraft
      tags: [copilot]
      summary: Capture a corporate-action source before extraction
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeDraftInput"
      responses:
        "201":
          description: Captured intake source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}:
    get:
      operationId: getIntakeDraft
      tags: [copilot]
      summary: Get a captured corporate-action source
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Intake source and extraction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/extract:
    post:
      operationId: extractIntakeDraft
      tags: [copilot]
      summary: Extract proposed corporate-action terms from a captured source
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Extracted source details ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/validate:
    post:
      operationId: validateIntakeDraft
      tags: [copilot]
      summary: Validate extracted corporate-action details before case creation
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeValidationInput"
      responses:
        "200":
          description: Updated draft after analyst validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDraft"
  /intake/drafts/{draftId}/create-case:
    post:
      operationId: createCaseFromIntakeDraft
      tags: [copilot]
      summary: Create a controlled case from analyst-validated intake data
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/DraftId"
      responses:
        "201":
          description: Created corporate-action event case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected document upload URL
      security:
        - CorporateActionSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlInput"
      responses:
        "200":
          description: Presigned upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResult"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [copilot]
      summary: Get a corporate action event and its workbench data
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Corporate action event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
    patch:
      operationId: updateEvent
      tags: [copilot]
      summary: Update analyst-controlled event terms
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/calculate:
    post:
      operationId: calculateEvent
      tags: [copilot]
      summary: Run deterministic eligibility and impact calculation
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateInput"
      responses:
        "200":
          description: Calculated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "409":
          description: Calculation is blocked by invalid or incomplete terms
        "404":
          description: Event not found
  /events/{eventId}/election:
    post:
      operationId: saveElection
      tags: [copilot]
      summary: Save an election for an affected account
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectionInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/approval:
    post:
      operationId: approveEvent
      tags: [copilot]
      summary: Record maker-checker approval
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/instruction:
    post:
      operationId: updateInstruction
      tags: [copilot]
      summary: Update simulated instruction status
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructionInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /events/{eventId}/reconciliation:
    post:
      operationId: saveReconciliation
      tags: [copilot]
      summary: Record expected versus actual settlement
      security:
        - CorporateActionSession: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
  /tasks:
    get:
      operationId: listTasks
      tags: [copilot]
      summary: List operational tasks and risk flags
      responses:
        "200":
          description: Operational tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /tasks/{taskId}/resolve:
    post:
      operationId: resolveTask
      tags: [copilot]
      summary: Resolve an operational task
      security:
        - CorporateActionSession: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /audit:
    get:
      operationId: listAudit
      tags: [copilot]
      summary: List audit history
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
      responses:
        "200":
          description: Audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
components:
  securitySchemes:
    CorporateActionSession:
      type: apiKey
      in: cookie
      name: corporate_actions_actor
      description: Signed HTTP-only demo identity available only in the non-production POC environment.
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: "Opaque session token: `Bearer <sid>`."
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        type: string
    DraftId:
      in: path
      name: draftId
      required: true
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [totalEvents, needsReview, dueToday, openTasks, breaks, recentActivity]
      properties:
        totalEvents: { type: number }
        needsReview: { type: number }
        dueToday: { type: number }
        openTasks: { type: number }
        breaks: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    EventSummary:
      type: object
      required: [id, reference, issuer, security, eventType, processingType, status, risk, marketDeadline, internalDeadline, affectedAccounts, amount, currency]
      properties:
        id: { type: string }
        reference: { type: string }
        issuer: { type: string }
        security: { type: string }
        eventType: { type: string }
        processingType: { type: string }
        status: { type: string }
        risk: { type: string }
        marketDeadline: { type: string }
        internalDeadline: { type: string }
        affectedAccounts: { type: number }
        amount: { type: number }
        currency: { type: string }
        isHero: { type: boolean }
        noticeReference: { type: string }
        settlementStage: { type: string }
        cashAmount: { type: number }
        cashCurrency: { type: string }
        shareAmount: { type: number }
        shareLabel: { type: string }
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [notice, terms, positions, impacts, options, instruction, reconciliation, tasks, audit, validation, calculation]
          properties:
            notice:
              $ref: "#/components/schemas/Notice"
            terms:
              type: array
              items:
                $ref: "#/components/schemas/Term"
            positions:
              type: array
              items:
                $ref: "#/components/schemas/Position"
            impacts:
              type: array
              items:
                $ref: "#/components/schemas/Impact"
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            instruction:
              $ref: "#/components/schemas/Instruction"
            reconciliation:
              $ref: "#/components/schemas/Reconciliation"
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/Task"
            audit:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
            validation:
              $ref: "#/components/schemas/Validation"
            calculation:
              $ref: "#/components/schemas/Calculation"
            securityMaster:
              $ref: "#/components/schemas/SecurityMaster"
    Notice:
      type: object
      required: [documentName, source, receivedAt, version, role, excerpt]
      properties:
        documentName: { type: string }
        source: { type: string }
        receivedAt: { type: string }
        version: { type: string }
        role: { type: string }
        excerpt: { type: string }
        pages:
          type: array
          items:
            $ref: "#/components/schemas/NoticePage"
        uploadState: { type: string }
        sourceDocumentId: { type: string }
        sourcePath: { type: string }
        sourceUrl: { type: string }
        previewUrl: { type: string }
        extractionMethod: { type: string }
        extractionConfidence: { type: number }
    NoticePage:
      type: object
      required: [page, text]
      properties:
        page: { type: number }
        text: { type: string }
    Term:
      type: object
      required: [key, label, value, page, evidence, confidence, reviewStatus]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
        page: { type: string }
        evidence: { type: string }
        confidence: { type: number }
        reviewStatus: { type: string }
        sourceType: { type: string }
        manuallyCorrected: { type: boolean }
        oldValue: { type: string }
        correctionReason: { type: string }
    Position:
      type: object
      required: [id, fund, account, isin, eligibleQuantity, positionDate, eligibilityStatus]
      properties:
        id: { type: string }
        fund: { type: string }
        account: { type: string }
        isin: { type: string }
        securityId: { type: string }
        settledQuantity: { type: number }
        unsettledQuantity: { type: number }
        eligibleQuantity: { type: number }
        positionDate: { type: string }
        eligibilityStatus: { type: string }
        dataQualityWarning: { type: string }
    Validation:
      type: object
      required: [missingTerms, isReady]
      properties:
        missingTerms:
          type: array
          items: { type: string }
        isReady: { type: boolean }
    Calculation:
      type: object
      required: [rounding, assumptions, sourceRule]
      properties:
        calculationRunAt: { type: string }
        rounding: { type: string }
        assumptions: { type: string }
        sourceRule: { type: string }
    SecurityMaster:
      type: object
      required: [securityId, isin, ticker, securityName, currency, market, status]
      properties:
        securityId: { type: string }
        isin: { type: string }
        ticker: { type: string }
        securityName: { type: string }
        issuer: { type: string }
        currency: { type: string }
        market: { type: string }
        status: { type: string }
        aliases:
          type: array
          items: { type: string }
    Impact:
      type: object
      required: [id, fund, account, eligibleQuantity, formula, expected, currency, status]
      properties:
        id: { type: string }
        fund: { type: string }
        account: { type: string }
        eligibleQuantity: { type: number }
        formula: { type: string }
        expected: { type: number }
        currency: { type: string }
        status: { type: string }
        election: { type: ["string", "null"] }
        approval: { type: string }
        expectedCash: { type: number }
        cashCurrency: { type: string }
        expectedSecurityQuantity: { type: number }
        expectedShares: { type: number }
        shareLabel: { type: string }
        entitlement: { type: number }
        securityMovement: { type: string }
        positionDate: { type: string }
        securityId: { type: string }
        eligibilityStatus: { type: string }
        dataQualityWarning: { type: string }
        electionDecision:
          type: object
          additionalProperties: true
    Option:
      type: object
      required: [id, label, description, result, default]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        result: { type: string }
        default: { type: boolean }
        fundingFormula: { type: string }
    Instruction:
      type: object
      required: [status, destination, reference, generatedAt, content]
      properties:
        status: { type: string }
        destination: { type: string }
        reference: { type: string }
        generatedAt: { type: string }
        content: { type: string }
        approvalActor: { type: string }
        simulated: { type: boolean }
    Reconciliation:
      type: object
      required: [expected, actual, difference, tolerance, status, note]
      properties:
        expected: { type: number }
        actual: { type: number }
        difference: { type: number }
        tolerance: { type: number }
        status: { type: string }
        note: { type: string }
        expectedCash: { type: number }
        actualCash: { type: number }
        expectedSecurityQuantity: { type: number }
        actualSecurityQuantity: { type: number }
        expectedCurrency: { type: string }
        actualCurrency: { type: string }
        expectedSettlementDate: { type: string }
        actualSettlementDate: { type: string }
        expectedAccount: { type: string }
        actualAccount: { type: string }
        classification: { type: string }
        investigationSteps:
          type: array
          items: { type: string }
    Task:
      type: object
      required: [id, eventId, title, detail, priority, owner, due, status, category]
      properties:
        id: { type: string }
        eventId: { type: string }
        title: { type: string }
        detail: { type: string }
        priority: { type: string }
        owner: { type: string }
        due: { type: string }
        status: { type: string }
        category: { type: string }
        dependency: { type: string }
        sourceRule: { type: string }
        escalationPath: { type: string }
        eventReference: { type: string }
    AuditEntry:
      type: object
      required: [id, eventId, action, actor, timestamp, detail]
      properties:
        id: { type: string }
        eventId: { type: string }
        action: { type: string }
        actor: { type: string }
        actorId: { type: string }
        actorRole: { type: string }
        timestamp: { type: string }
        detail: { type: string }
        actorType: { type: string }
        previousValue: { type: string }
        newValue: { type: string }
        reason: { type: string }
        evidenceId: { type: string }
        workflowStatus: { type: string }
    EventUpdate:
      type: object
      properties:
        terms:
          type: array
          items:
            $ref: "#/components/schemas/TermUpdate"
        reason: { type: string }
    TermUpdate:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
        reason: { type: string }
    ElectionInput:
      type: object
      required: [impactId, optionId, quantityElected]
      properties:
        impactId: { type: string }
        optionId: { type: string }
        quantityElected: { type: number }
